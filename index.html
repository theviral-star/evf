  <style>

    html,
    body {
      margin: 0 !important;
      padding: 0 !important;

      width: 100% !important;
      height: 100% !important;

      overflow: hidden !important;

      background: #000 !important;
    }

    body {
      font-family: Arial, sans-serif;
    }

    /* FULLSCREEN */
    .video-page {
      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;
      height: 100dvh;

      background:
        linear-gradient(
          rgba(0,0,0,.40),
          rgba(0,0,0,.40)
        ),
        url("https://cdn.aceimg.com/ZCGQrW201.png")
        center center / cover no-repeat;

      overflow: hidden;

      z-index: 1;
    }

    /* TOP BAR */
    .top-bar {
      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      padding: 22px 35px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      box-sizing: border-box;

      color: #fff;

      font-size: 18px;

      z-index: 5;
    }

    .top-bar span {
      background: rgba(0,0,0,.55);

      padding: 10px 20px;

      border-radius: 25px;
    }

    /* PLAY / WATCH BUTTON */
    .watch-button {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 110px;
      height: 110px;

      border-radius: 50%;

      background: #4fc3f7;

      display: flex;
      justify-content: center;
      align-items: center;

      text-decoration: none;

      z-index: 6;

      box-shadow:
        0 4px 20px rgba(0,0,0,.35);

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .watch-button:hover {
      transform:
        translate(-50%, -50%)
        scale(1.08);

      box-shadow:
        0 6px 30px rgba(0,0,0,.50);
    }

    /* PLAY ICON */
    .watch-button::after {
      content: "";

      width: 0;
      height: 0;

      margin-left: 8px;

      border-top: 25px solid transparent;
      border-bottom: 25px solid transparent;
      border-left: 36px solid #fff;
    }

    /* PROGRESS BAR */
    .progress {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      width: 100%;
      height: 6px;

      background:
        rgba(255,255,255,.30);

      z-index: 7;
    }

    .bar {
      width: 38%;
      height: 100%;

      background: #ff0000;
    }

    /* =====================================================
       HISTATS COUNTER
       ===================================================== */

    #histats_counter {
      position: fixed;

      left: -9999px;
      top: -9999px;

      width: 1px;
      height: 1px;

      overflow: hidden;

      opacity: 0;

      pointer-events: none;

      z-index: -1;
    }

    /* MOBILE */
    @media (max-width: 600px) {

      .watch-button {
        width: 90px;
        height: 90px;
      }

      .watch-button::after {
        border-top-width: 20px;
        border-bottom-width: 20px;
        border-left-width: 30px;
      }

      .top-bar {
        padding: 20px 25px;
        font-size: 16px;
      }

      .top-bar span {
        padding: 8px 16px;
      }

      .progress {
        height: 5px;
      }

    }

  </style>
